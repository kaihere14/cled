[package]
name = "cled-desktop"
description = "Cled desktop application"
version.workspace = true
edition.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "cled_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
cled-clipboard = { path = "../../../crates/cled-clipboard" }
serde = { version = "1", features = ["derive"] }
