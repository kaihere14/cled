[package]
name = "cled-desktop"
description = "Cled desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "cled_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
base64 = "0.22"
cled-clipboard = { path = "../../../crates/cled-clipboard" }
cled-lan = { path = "../../../crates/cled-lan" }
cled-sync = { path = "../../../crates/cled-sync" }
gethostname = "1"
# PNG only, for UI thumbnails. Already compiled in via arboard's image support.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Relay WebSocket client.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
# TLS for `wss://` relays. tokio-tungstenite picks no crypto provider itself; enabling `ring`
# here makes it the only one, so rustls selects it automatically.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.4"
tauri-plugin-single-instance = "2.4"
