[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/cled-clipboard", "crates/cled-sync"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# TODO(license): set `license` once the project license is decided.

# Profiles only take effect at the workspace root.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
