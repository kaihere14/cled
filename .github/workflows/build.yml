name: Build

# Builds installers for Windows, macOS, and Linux and publishes them as a GitHub Release, so they
# can be downloaded from the repository's Releases page. Builds are unsigned (see
# docs/building.md for what that means on each OS).
#
# - Run it from the Actions tab ("Run workflow"): publishes a pre-release tagged
#   v<version>-build.<run number>.
# - Push a tag like v0.1.0: publishes a release for that tag.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Tags with a suffix (v0.1.0-build.7, v0.2.0-beta) are pre-releases.
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          # Take the ID from the create call itself; listing releases right after creating a
          # draft can miss it.
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Cled $TAG" \
            -F body=@.github/release-notes.md \
            -F draft=true \
            -F prerelease="$prerelease" \
            --jq .id)
          if [[ -z "$id" ]]; then
            echo "::error::Could not create the release"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # Oldest supported runner: bundles built on an older glibc run on more distros.
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.rust-targets }}
          rustflags: ""

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release-id }}

  publish-release:
    name: Publish release
    needs: [create-release, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          # Never publish a release without installers.
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq 'map(.name) | join("\n")')
          echo "Assets:"; echo "$assets"
          for pattern in '\.deb$' '\.rpm$' '\.AppImage$' '\.msi$' '-setup\.exe$' '\.dmg$'; do
            if ! grep -qE -- "$pattern" <<< "$assets"; then
              echo "::error::Missing installer matching $pattern; leaving the release as a draft"
              exit 1
            fi
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
