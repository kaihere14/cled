name: Build

# Builds installers for Windows, macOS, and Linux and publishes them as a GitHub Release, so they
# can be downloaded from the repository's Releases page. Builds are unsigned (see
# docs/building.md for what that means on each OS).
#
# - Run it from the Actions tab ("Run workflow"): publishes a pre-release tagged
#   v<version>-build.<run number>.
# - Push a tag like v0.1.0: publishes a release for that tag.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Tags with a suffix (v0.1.0-build.7, v0.2.0-beta) are pre-releases.
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" --draft $prerelease \
            --target "$GITHUB_SHA" \
            --title "Cled $TAG" \
            --notes-file .github/release-notes.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          echo "id=$id" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # Oldest supported runner: bundles built on an older glibc run on more distros.
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.rust-targets }}
          rustflags: ""

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release-id }}

  publish-release:
    name: Publish release
    needs: [create-release, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
