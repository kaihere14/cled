[package]
name = "cled-clipboard"
description = "Cross-platform clipboard access and change detection for Cled"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Initial backend only; never exposed in the public API. See src/platform/.
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
log = "0.4"
thiserror = "2"

# Platform crates below are already pulled in by arboard; they're declared directly for what
# arboard doesn't expose: "don't record this" hints, change tokens, and change notifications.
[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.3", features = ["std", "monitor"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSEnumerator"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "emscripten"))))'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"
x11rb = { version = "0.13", features = ["xfixes"] }

[dev-dependencies]
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
